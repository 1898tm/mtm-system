:root{--gold:#ffd60a;--green:#30d158;--cyan:#0071e3;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;

  --font:'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
body::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,.025)1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025)1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.page{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:1.5rem 1rem 6rem}
.hero{text-align:center;padding:2rem 1rem 1.5rem}
.hero-label{font-size:.6rem;font-weight:700;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin-bottom:.4rem}
.hero-title{font-size:2rem;font-weight:800;letter-spacing:-.04em;background:linear-gradient(145deg,#fff 40%,rgba(255,214,10,.6));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:.75rem;color:var(--dim);margin-top:.4rem}

/* Search */
.search-wrap{position:relative;margin-bottom:1.5rem}
.search-input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:12px;padding:.75rem 1rem .75rem 2.6rem;color:var(--text);font-size:.85rem;font-family:var(--font);outline:none;transition:border-color .15s}
.search-input:focus{border-color:rgba(255,214,10,.4)}
.search-input::placeholder{color:var(--dimmer)}
.search-icon{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);font-size:.95rem;pointer-events:none}
.search-count{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);font-size:.65rem;color:var(--dimmer)}

/* Category filters */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.4rem}
.filter-btn{font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.32rem .75rem;border-radius:980px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-family:var(--font);transition:all .15s;white-space:nowrap}
.filter-btn:hover{border-color:rgba(255,255,255,.25);color:#fff}
.filter-btn.active{background:rgba(255,214,10,.12);border-color:rgba(255,214,10,.4);color:rgba(255,214,10,.95)}

/* Section */
.vault-section{margin-bottom:1.4rem}
.section-label{font-size:.58rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dimmer);margin-bottom:.65rem;display:flex;align-items:center;gap:.5rem}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* Doc items */
.doc-list{display:flex;flex-direction:column;gap:.45rem}
.doc-item{display:flex;align-items:center;gap:.85rem;padding:.7rem .9rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:11px;text-decoration:none;color:var(--text);transition:border-color .15s,background .15s;cursor:pointer}
.doc-item:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
.doc-item.urgent{border-color:rgba(255,69,58,.3);background:rgba(255,69,58,.04)}
.doc-item.urgent:hover{border-color:rgba(255,69,58,.55)}
.doc-icon{font-size:1.1rem;flex-shrink:0;width:24px;text-align:center}
.doc-info{flex:1;min-width:0}
.doc-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-meta{font-size:.62rem;color:var(--dim);margin-top:.1rem}
.doc-badges{display:flex;gap:.35rem;flex-shrink:0;align-items:center}
.badge{font-size:.55rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:.18rem .5rem;border-radius:980px;border:1px solid;white-space:nowrap}
.badge-doc{color:rgba(0,113,227,.9);border-color:rgba(0,113,227,.3);background:rgba(0,113,227,.08)}
.badge-pdf{color:rgba(255,100,100,.9);border-color:rgba(255,100,100,.3);background:rgba(255,100,100,.08)}
.badge-html{color:rgba(191,90,242,.9);border-color:rgba(191,90,242,.3);background:rgba(191,90,242,.08)}
.badge-link{color:rgba(48,209,88,.9);border-color:rgba(48,209,88,.3);background:rgba(48,209,88,.08)}
.badge-urgent{color:rgba(255,69,58,.9);border-color:rgba(255,69,58,.4);background:rgba(255,69,58,.1)}
.badge-sheet{color:rgba(255,214,10,.9);border-color:rgba(255,214,10,.3);background:rgba(255,214,10,.08)}
.badge-folder{color:rgba(255,159,10,.9);border-color:rgba(255,159,10,.3);background:rgba(255,159,10,.08)}
.no-results{text-align:center;padding:2rem;font-size:.8rem;color:var(--dimmer);display:none}

function badgeClass(b) {
  var map = {doc:'badge-doc',pdf:'badge-pdf',html:'badge-html',link:'badge-link',sheet:'badge-sheet',folder:'badge-folder'};
  return map[b] || 'badge-link';
}
function badgeLabel(b) {
  var map = {doc:'Google Doc',pdf:'PDF',html:'HTML',link:'Link',sheet:'Sheet',folder:'Folder'};
  return map[b] || b;
}

var SECTION_LABELS = {
  'life-os':'Life OS',legal:'Legal',finance:'Finance',tax:'Tax',
  business:'Business',books:'Books & Legacy',medical:'Medical',
  property:'Property',family:'Family',systems:'MTM Systems'
};
var SECTION_ORDER = ['life-os','legal','finance','tax','business','books','medical','property','family','systems'];

function render(items) {
  var container = document.getElementById('vault-content');
  var noRes = document.getElementById('no-results');
  container.innerHTML = '';
  if (!items.length) { noRes.style.display = 'block'; document.getElementById('count').textContent = ''; return; }
  noRes.style.display = 'none';
  document.getElementById('count').textContent = items.length + ' docs';

  var grouped = {};
  items.forEach(function(item) {
    var c = item.cat;
    if (!grouped[c]) grouped[c] = [];
    grouped[c].push(item);
  });

  var orderedKeys = SECTION_ORDER.filter(function(k){ return grouped[k] && grouped[k].length; });
  orderedKeys.forEach(function(cat) {
    var sec = document.createElement('div');
    sec.className = 'vault-section';
    var label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = SECTION_LABELS[cat] || cat;
    sec.appendChild(label);
    var list = document.createElement('div');
    list.className = 'doc-list';
    grouped[cat].forEach(function(item) {
      var a = item.url ? document.createElement('a') : document.createElement('div');
      a.className = 'doc-item' + (item.urgent ? ' urgent' : '');
      if (item.url) {
        a.href = item.url;
        if (item.url.startsWith('http') || item.url.startsWith('tel:') || item.url.startsWith('mailto:')) a.target = '_blank';
      }
      var urgentBadge = item.urgent ? '<span class="badge badge-urgent">Urgent</span>' : '';
      a.innerHTML =
        '<div class="doc-icon">' + item.icon + '</div>' +
        '<div class="doc-info"><div class="doc-name">' + item.name + '</div><div class="doc-meta">' + item.meta + '</div></div>' +
        '<div class="doc-badges">' + urgentBadge + '<span class="badge ' + badgeClass(item.badge) + '">' + badgeLabel(item.badge) + '</span></div>';
      list.appendChild(a);
    });
    sec.appendChild(list);
    container.appendChild(sec);
  });
}

function filterVault() {
  var q = document.getElementById('search').value.toLowerCase();
  var filtered = VAULT.filter(function(item) {
    var matchCat = activeFilter === 'all' || item.cat === activeFilter;
    var matchSearch = !q || item.name.toLowerCase().includes(q) || item.meta.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
  render(filtered);
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  filterVault();
}

// Initial render
filterVault();
document.getElementById('count').textContent = VAULT.length + ' docs';
</script>
</body>
</html>
